# Weekly safety copy of the Neon media bucket to R2 (docs/cms-plan/04-media.md).
# Sundays 04:00 Brussels ≈ 02:00 UTC. rclone sync makes R2 an exact mirror; the nightly
# database dump plus this mirror is everything needed to restore the site.
name: media-mirror
on:
  schedule:
    - cron: '0 2 * * 0'
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Install rclone
        run: curl -fsSL https://rclone.org/install.sh | sudo bash
      - name: Sync media → tnl-media-mirror
        env:
          RCLONE_CONFIG_NEON_TYPE: s3
          RCLONE_CONFIG_NEON_PROVIDER: Other
          RCLONE_CONFIG_NEON_ENDPOINT: ${{ vars.NEON_STORAGE_ENDPOINT }}
          RCLONE_CONFIG_NEON_ACCESS_KEY_ID: ${{ secrets.NEON_STORAGE_READ_KEY_ID }}
          RCLONE_CONFIG_NEON_SECRET_ACCESS_KEY: ${{ secrets.NEON_STORAGE_READ_SECRET }}
          RCLONE_CONFIG_NEON_FORCE_PATH_STYLE: 'true'
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_NO_CHECK_BUCKET: 'true'
        run: |
          rclone sync neon:media r2:tnl-media-mirror --checksum --transfers 8 --stats-one-line -v
          rclone size r2:tnl-media-mirror
